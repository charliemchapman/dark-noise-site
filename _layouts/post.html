---
layout: main
---
<main class="release-post-page">
  <a class="release-back-link" href="/releases">Release Archive</a>
  <article class="release-post">
    <header class="release-post-header">
      <p class="section-kicker">Release</p>
      <h1>{{ page.title }}</h1>
      <p class="release-date">{{ page.date | date: "%B %-d, %Y" }}</p>
    </header>

    <div class="release-post-content">
      {{ content }}
    </div>
  </article>
</main>
