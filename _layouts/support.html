---
layout: main
---
<main class="support-page">
  <a class="support-back-link" href="/help">Help Center</a>
  <article class="support-article">
    <p class="section-kicker">Support</p>
    <h1>{{ page.title }}</h1>

    <div class="support-article-content">
      {{ content }}
    </div>

    <footer class="support-article-footer">
      <p>Still have questions?</p>
      <a href="mailto:{{ site.supportEmail }}">{{ site.supportEmail }}</a>
    </footer>
  </article>
</main>
